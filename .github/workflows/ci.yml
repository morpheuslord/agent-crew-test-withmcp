name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (version in the comment above it) so a moved tag
# cannot change what runs (F-095).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: taskboard_test
          POSTGRES_PASSWORD: taskboard_test
          POSTGRES_DB: taskboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskboard_test -d taskboard_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-alpine3.21
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskboard_test:taskboard_test@127.0.0.1:5432/taskboard_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up uv
        # v10.3.0, pinned by commit SHA (third-party action).
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.21"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests migrations

      - name: Check formatting
        run: uv run ruff format --check src tests migrations

      - name: Type check
        run: uv run mypy

      - name: Tests (unit + integration, coverage >= 80%)
        run: uv run pytest --cov --cov-report=term

  ui:
    name: UI (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests (coverage >= 80%)
        run: npm test

      - name: Build
        run: npm run build

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        # v4.0.1, pinned by commit SHA (third-party action).
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Init (no backend)
        run: terraform -chdir=infra/envs/dev init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra/envs/dev validate
