name: Codacy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy:
    name: Codacy analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Codacy runs every tool it knows and emits one SARIF run per tool (24 here). Many of them do
      # not apply to this stack (PMD is for Java) or cannot run in this setup, and only add failing
      # entries to code scanning. Keep only the tools listed in CODACY_TOOLS; the TypeScript code
      # is linted by ESLint and type-checked in the CI workflow instead.
      # Then give each run a stable category of its own, drop Codacy's partial fingerprints so
      # upload-sarif computes consistent ones, and split the runs into files of at most 20 runs
      # each (the code scanning limit per upload).
      - name: Prepare SARIF for code scanning
        env:
          CODACY_TOOLS: >-
            bandit checkov lizard opengrep prospector pylint pylintpython3 ruff spectral
        run: |
          jq --arg tools "$CODACY_TOOLS" '
            ($tools | split(" ") | map(select(. != ""))) as $allowed
            | .runs |= map(select(
                ((.tool.driver.name // "")
                  | ascii_downcase
                  | sub(" \\(reported by codacy\\)$"; "")) as $tool
                | $allowed | index($tool) != null
              ))
            | .runs |= (
              to_entries
              | (map(.value.tool.driver.name // "codacy")) as $names
              | map(
                  (.value.tool.driver.name // "codacy") as $name
                  | .key as $index
                  | .value
                  + {automationDetails: {id: (
                      "codacy/" + $name
                      + (if ([$names[] | select(. == $name)] | length) > 1
                         then "/" + ($index | tostring) else "" end)
                    )}}
                  | if (.results | type) == "array"
                    then .results |= map(del(.partialFingerprints))
                    else . end
                )
            )
          ' results.sarif > results.prepared.sarif
          total=$(jq '.runs | length' results.prepared.sarif)
          if [ "$total" -gt 60 ]; then
            echo "::error::Codacy produced $total SARIF runs; add another upload step."
            exit 1
          fi
          mkdir -p codacy-sarif
          for start in $(seq 0 20 $((total - 1))); do
            jq --argjson start "$start" '.runs |= .[$start:$start + 20]' results.prepared.sarif \
              > "codacy-sarif/part-$((start / 20)).sarif"
          done
          echo "Split $total runs into $(find codacy-sarif -name '*.sarif' | wc -l) file(s)."

      - name: Upload SARIF to code scanning (runs 1-20)
        if: hashFiles('codacy-sarif/part-0.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codacy-sarif/part-0.sarif
          category: codacy-part-0

      - name: Upload SARIF to code scanning (runs 21-40)
        if: hashFiles('codacy-sarif/part-1.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codacy-sarif/part-1.sarif
          category: codacy-part-1

      - name: Upload SARIF to code scanning (runs 41-60)
        if: hashFiles('codacy-sarif/part-2.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codacy-sarif/part-2.sarif
          category: codacy-part-2
