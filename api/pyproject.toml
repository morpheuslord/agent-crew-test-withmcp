[project]
name = "taskboard-api"
version = "0.1.0"
description = "Taskboard REST API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "boto3==1.43.114",
    "email-validator==2.3.0",
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "sqlalchemy==2.1.5",
    "uvicorn==0.54.0",
]

[project.scripts]
taskboard-admin = "taskboard.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]==1.43.114",
    "moto[s3]==5.2.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskboard"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests also use fixed dummy credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["taskboard", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real PostgreSQL and Redis"]

[tool.coverage.run]
source = ["taskboard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
